// Galdur UI is a multi-loader project:
//   common/    shared code and assets, compiled against vanilla Minecraft only
//   neoforge/  NeoForge entry point and metadata
// Each loader module compiles the sources of common into its own jar, so a mod depends on a single
// artifact (galdurui-<loader>) and never on common.

subprojects {
    apply plugin: 'java-library'

    version = rootProject.mod_version
    group = rootProject.mod_group_id

    // Minecraft 1.21.1 ships with Java 21.
    java.toolchain.languageVersion = JavaLanguageVersion.of(21)

    repositories {
        mavenCentral() // JUnit and Gson for the unit tests
        maven {
            // Mods published on Modrinth (Spark, EMI)
            url = "https://api.modrinth.com/maven"
            content { includeGroup "maven.modrinth" }
        }
        maven {
            // JEI, for the optional integration (internal.compat.jei), and its config library
            url = "https://maven.blamejared.com/"
            content {
                includeGroup "mezz.jei"
                includeGroup "net.mezzdev.config"
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    dependencies {
        // Unit tests without Minecraft. Gson: same version as the one shipped with the game.
        testImplementation platform('org.junit:junit-bom:5.11.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        testImplementation 'com.google.code.gson:gson:2.10.1'
    }
}

// The loader modules: each one builds a jar with the shared sources of common.
configure(subprojects.findAll { it.name != 'common' }) {
    apply plugin: 'maven-publish'

    base {
        archivesName = "${rootProject.mod_id}-${project.name}"
    }

    // The shared code and assets are compiled and packaged as if they were part of the module.
    sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
    sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

    // TEMPORARY Maven publication to the local repo/ folder, until Galdur Studio has a Maven repository.
    publishing {
        publications {
            register('mavenJava', MavenPublication) {
                artifactId = "${rootProject.mod_id}-${project.name}"
                from components.java
            }
        }
        repositories {
            maven {
                url = rootProject.file("repo").toURI()
            }
        }
    }
}
