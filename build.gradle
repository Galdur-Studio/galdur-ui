plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral() // JUnit and Gson for the unit tests
    maven {
        // Mods published on Modrinth (Spark, EMI)
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven {
        // JEI, for the optional integration (internal.compat.jei), and its config library
        url = "https://maven.blamejared.com/"
        content {
            includeGroup "mezz.jei"
            includeGroup "net.mezzdev.config"
        }
    }
}

base {
    archivesName = mod_id
}

// Minecraft 1.21.1 ships with Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    // Test mod (demo screens, test blocks, dev commands): loaded by the dev runs only, never in the jar.
    testmod {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    // Dev tools (sprite generator): compiled on demand only, never in the jar.
    tools {
        java.srcDirs = ['tools']
        resources.srcDirs = []
    }
}

// localRuntime: present when running in dev, but not passed on to mods that depend on Galdur UI.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    testmodRuntimeClasspath.extendsFrom localRuntime
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        galduruitest {
            sourceSet(sourceSets.testmod)
        }
    }

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        configureEach {
            // Every dev run loads the library and the test mod.
            sourceSet = sourceSets.testmod
            loadedMods = [mods."${mod_id}", mods.galduruitest]

            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
}

neoForge.addModdingDependenciesTo(sourceSets.testmod)

dependencies {
    // Unit tests without Minecraft (src/test/java). Gson: same version as the one shipped with the game.
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.google.code.gson:gson:2.10.1'

    // Spark profiler (/sparkc): dev only.
    localRuntime "maven.modrinth:spark:1.10.124-neoforge-1.21.1"

    // Optional JEI and EMI integrations (internal.compat): compiled against their API but neither
    // in the jar nor passed on. Without them installed, their plugins are simply never loaded.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    compileOnly "maven.modrinth:emi:${emi_version}+neoforge"
    localRuntime "maven.modrinth:emi:${emi_version}+neoforge"
}

// Fills the ${...} placeholders of src/main/templates (neoforge.mods.toml) from gradle.properties.
// A missing property fails the build.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// TEMPORARY Maven publication to the local repo/ folder, until Galdur Studio has a Maven repository.
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = mod_id
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// Regenerates the grayscale 9-slice sprites (colour comes from the theme at render time).
// Run by hand; CI checks that the committed PNGs are up to date.
tasks.register('generateSprites', JavaExec) {
    group = 'galdur'
    description = 'Generates the grayscale 9-slice sprites (PNG + .mcmeta), tinted by the theme at render time.'
    classpath = sourceSets.tools.runtimeClasspath
    mainClass = 'GenerateSprites'
    workingDir = projectDir
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
