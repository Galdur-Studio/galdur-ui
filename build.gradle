plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral() // JUnit et Gson pour les tests unitaires
    maven {
        // Mods publiés sur Modrinth (ex. Spark pour profiler en dev)
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

base {
    archivesName = mod_id
}

// Minecraft 1.21.1 est livré aux joueurs avec Java 21 : le mod cible donc Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        configureEach {
            // Marqueurs de journal, séparés par des virgules : REGISTRIES trace les événements
            // d'enregistrement ; SCAN (analyse des mods) et REGISTRYDUMP (contenu des registres)
            // existent aussi.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // DEBUG en console : affiche entre autres « Thème Galdur UI chargé (...) ».
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // Indique au jeu quelles sources appartiennent au mod galdurui.
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// localRuntime : dépendance présente au lancement en développement, mais pas transmise aux mods
// qui dépendent de Galdur UI (contrairement à runtimeOnly).
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Tests unitaires sans Minecraft (src/test/java). Gson : même version que celle livrée avec le jeu.
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.google.code.gson:gson:2.10.1'

    // Profileur Spark (/sparkc) : uniquement en dev, ni dans notre jar ni transmis à nos mods.
    localRuntime "maven.modrinth:spark:1.10.124-neoforge-1.21.1"
}

// Remplace les ${...} des gabarits de src/main/templates (neoforge.mods.toml) par les valeurs de
// gradle.properties. Une propriété manquante fait échouer le build.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Le résultat est ajouté aux ressources, pour Gradle comme pour l'IDE, et régénéré à chaque
// synchronisation du projet dans l'IDE.
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// Publication Maven TEMPORAIRE vers le dossier local repo/ : à remplacer par le vrai dépôt
// Maven de Galdur Studio quand nos mods dépendront de Galdur UI.
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// Outils de développement (générateur de sprites) : source set séparé, compilé uniquement
// à la demande et jamais inclus dans le jar du mod.
sourceSets {
    tools {
        java.srcDirs = ['tools']
        resources.srcDirs = []
    }
}

// Régénère les sprites 9-slice en niveaux de gris (la couleur vient du thème, au rendu).
// À lancer à la main, pas lié au build ; la CI vérifie que les PNG commités sont à jour.
tasks.register('generateSprites', JavaExec) {
    group = 'galdur'
    description = 'Génère les sprites 9-slice en niveaux de gris (PNG + .mcmeta), teintés au rendu par le thème.'
    classpath = sourceSets.tools.runtimeClasspath
    mainClass = 'GenerateSprites'
    workingDir = projectDir
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // sources et Javadoc en français, avec accents
}

// IntelliJ ne télécharge plus de lui-même les sources et la Javadoc des dépendances.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
