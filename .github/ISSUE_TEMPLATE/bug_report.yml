name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Galdur UI version
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: loader
    attributes:
      label: Loader
      options: [NeoForge, Fabric, Forge]
    validations:
      required: true
  - type: input
    id: minecraft
    attributes:
      label: Minecraft and loader version
      placeholder: 1.21.1, NeoForge 21.1.256
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log or crash report
      description: Paste it, or attach it as a file (latest.log or crash-reports/).
      render: text
