name: Release

# Publishes the three jars (NeoForge, Fabric, Forge) on GitHub, Modrinth and CurseForge
# when a tag "v<mod_version>" is pushed. "Run workflow" with dry-run checked tests everything
# without publishing anything.
#
# Required in the repository settings (Settings > Secrets and variables > Actions):
#   secrets:   MODRINTH_TOKEN, CURSEFORGE_TOKEN
#   variables: MODRINTH_ID (project id or slug), CURSEFORGE_ID (numeric project id)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Check everything without publishing'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read the version
        id: meta
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match mod_version=$version in gradle.properties."
            exit 1
          fi
          # The changelog section of this version becomes the release notes.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && index($0, "## [") == 1 { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No section [$version] in CHANGELOG.md."
            exit 1
          fi

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Check the jars hold no test mod
        run: |
          v=${{ steps.meta.outputs.version }}
          if for jar in neoforge/build/libs/galdurui-neoforge-$v.jar fabric/build/libs/galdurui-fabric-$v.jar forge/build/libs/galdurui-forge-$v.jar; do unzip -l "$jar"; done | grep -E "testmod|galduruitest|resourcepacks/"; then
            echo "Test mod files found in a jar."
            exit 1
          fi

      - name: Publish NeoForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          dry-run: ${{ env.DRY_RUN }}
          files: neoforge/build/libs/galdurui-neoforge-${{ steps.meta.outputs.version }}.jar
          name: Galdur UI ${{ steps.meta.outputs.version }} (NeoForge)
          version: ${{ steps.meta.outputs.version }}+neoforge
          version-type: release
          changelog-file: release-notes.md
          loaders: neoforge
          game-versions: 1.21.1
          java: 21
          dependencies: |
            jei(optional)
            emi(optional)

      - name: Publish Fabric
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          dry-run: ${{ env.DRY_RUN }}
          files: fabric/build/libs/galdurui-fabric-${{ steps.meta.outputs.version }}.jar
          name: Galdur UI ${{ steps.meta.outputs.version }} (Fabric)
          version: ${{ steps.meta.outputs.version }}+fabric
          version-type: release
          changelog-file: release-notes.md
          loaders: fabric
          game-versions: 1.21.1
          java: 21
          dependencies: |
            fabric-api(required)
            modmenu(optional)
            jei(optional)
            emi(optional)

      - name: Publish Forge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          dry-run: ${{ env.DRY_RUN }}
          files: forge/build/libs/galdurui-forge-${{ steps.meta.outputs.version }}.jar
          name: Galdur UI ${{ steps.meta.outputs.version }} (Forge)
          version: ${{ steps.meta.outputs.version }}+forge
          version-type: release
          changelog-file: release-notes.md
          loaders: forge
          game-versions: 1.21.1
          java: 21
          dependencies: |
            jei(optional)
            emi(optional)

      # One GitHub release with the three jars.
      - name: GitHub release
        if: env.DRY_RUN != 'true' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=${{ steps.meta.outputs.version }}
          gh release create "$GITHUB_REF_NAME" \
            --title "Galdur UI $v" \
            --notes-file release-notes.md \
            "neoforge/build/libs/galdurui-neoforge-$v.jar" \
            "fabric/build/libs/galdurui-fabric-$v.jar" \
            "forge/build/libs/galdurui-forge-$v.jar"
