name: Release

# Publishes every jar (each Minecraft version and loader) on GitHub, Modrinth and CurseForge
# when a tag "v<mod.version>" is pushed. "Run workflow" with dry-run checked tests everything
# without publishing anything.
#
# Required in the repository settings (Settings > Secrets and variables > Actions):
#   secrets:   MODRINTH_TOKEN, CURSEFORGE_TOKEN
#   variables: MODRINTH_ID (project id or slug), CURSEFORGE_ID (numeric project id)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Check everything without publishing'
        type: boolean
        default: true

permissions:
  contents: write

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || 'false' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 17, 21 and 25
        uses: actions/setup-java@v6
        with:
          java-version: |
            17
            21
            25
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read the version
        id: meta
        run: |
          version=$(grep -oP '^mod\.version = "\K[^"]+' stonecutter.properties.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match mod.version=$version in stonecutter.properties.toml."
            exit 1
          fi
          # The changelog section of this version becomes the release notes.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && index($0, "## [") == 1 { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No section [$version] in CHANGELOG.md."
            exit 1
          fi

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Check the jars hold no test mod
        run: |
          if for jar in versions/*/build/libs/*.jar; do unzip -l "$jar"; done | grep -E "testmod|galduruitest|resourcepacks/"; then
            echo "Test mod files found in a jar."
            exit 1
          fi

      # One entry per jar: versions/<minecraft>-<loader>.
      - name: List the jars to publish
        id: matrix
        run: |
          matrix=$(python3 .github/scripts/release_matrix.py "${{ steps.meta.outputs.version }}")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | python3 -m json.tool

      - name: Upload jars and release notes
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            versions/*/build/libs/*.jar
            release-notes.md
          if-no-files-found: error

      - name: Dry run summary
        if: env.DRY_RUN == 'true'
        run: |
          echo "Dry run: nothing published. Would publish version ${{ steps.meta.outputs.version }}:"
          ls versions/*/build/libs/*.jar
          cat release-notes.md

  publish:
    needs: build
    if: github.event_name == 'push' || inputs.dry-run == false
    runs-on: ubuntu-latest
    strategy:
      # One upload at a time: Modrinth and CurseForge limit the request rate.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - name: Download jars
        uses: actions/download-artifact@v7
        with:
          name: release

      - name: Publish ${{ matrix.node }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ matrix.jar }}
          name: ${{ matrix.name }}
          version: ${{ matrix.version }}
          version-type: release
          changelog-file: release-notes.md
          loaders: ${{ matrix.loader }}
          game-versions: ${{ matrix.game_versions }}
          java: ${{ matrix.java }}
          dependencies: ${{ matrix.dependencies }}

  # One GitHub release with every jar.
  github-release:
    needs: [build, publish]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Download jars
        uses: actions/download-artifact@v7
        with:
          name: release

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=${{ needs.build.outputs.version }}
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Galdur UI $v" \
            --notes-file release-notes.md \
            versions/*/build/libs/*.jar
