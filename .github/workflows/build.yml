name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      # Les PNG commités doivent être exactement ceux que produit tools/GenerateSprites.java.
      # git status (et non git diff) voit aussi les fichiers nouveaux, non suivis.
      - name: Check sprites are up to date
        run: |
          ./gradlew generateSprites --no-daemon
          changes=$(git status --porcelain -- src/main/resources/assets/galdurui/textures)
          if [ -n "$changes" ]; then
            echo "Sprites non à jour (relancer ./gradlew generateSprites et commiter) :"
            echo "$changes"
            git diff --stat -- src/main/resources/assets/galdurui/textures
            exit 1
          fi

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: galdur-ui-jar
          path: build/libs/*.jar
          if-no-files-found: error
