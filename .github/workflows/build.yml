name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # Gradle runs on Java 25 (Stonecutter needs it); each Minecraft version compiles with its own
      # Java (mc.java in stonecutter.properties.toml): 17 for 1.20.1, 21 for 1.21.1, 25 for 26.x.
      - name: Setup JDK 17, 21 and 25
        uses: actions/setup-java@v6
        with:
          java-version: |
            17
            21
            25
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Builds every Minecraft version and loader declared in settings.gradle.kts: one jar each.
      - name: Build with Gradle
        run: ./gradlew build javadoc compileTestmodJava --no-daemon

      # The test mod (src/testmod) and the dev tools must never end up in a library jar.
      - name: Check the jars hold no test mod
        run: |
          if for jar in versions/*/build/libs/*.jar; do unzip -l "$jar"; done | grep -E "testmod|galduruitest|resourcepacks/"; then
            echo "Test mod files found in a jar."
            exit 1
          fi

      # Forge 1.20.1 runs mods with SRG names: its jar must be reobfuscated and carry the mixin refmap,
      # or it only works in the development client.
      - name: Check the Forge 1.20.1 jar is reobfuscated
        run: |
          for jar in versions/1.20.1-forge/build/libs/*.jar; do
            unzip -p "$jar" com/galdurstudio/galdurui/internal/render/GaldurRender.class | grep -aq 'm_[0-9]*_'               || { echo "$jar uses Mojang names: not reobfuscated."; exit 1; }
            unzip -l "$jar" | grep -q galdurui.refmap.json || { echo "$jar has no mixin refmap."; exit 1; }
          done

      # A jar must only hold its own loader's code.
      - name: Check each jar holds one loader
        run: |
          status=0
          for jar in versions/*/build/libs/*.jar; do
            loader=$(basename "$(dirname "$(dirname "$(dirname "$jar")")")" | sed 's/.*-//')
            for other in neoforge fabric forge; do
              [ "$other" = "$loader" ] && continue
              if unzip -l "$jar" | grep -qE "com/galdurstudio/galdurui/(api/)?$other/"; then
                echo "$jar holds $other code."
                status=1
              fi
            done
          done
          exit $status

      # The committed PNGs must be exactly what tools/src/main/java/GenerateSprites.java produces.
      # git status (not git diff) also sees new, untracked files.
      - name: Check sprites are up to date
        run: |
          ./gradlew :tools:generateSprites --no-daemon
          changes=$(git status --porcelain -- src/main/resources/assets/galdurui/textures)
          if [ -n "$changes" ]; then
            echo "Sprites out of date (run ./gradlew :tools:generateSprites and commit):"
            echo "$changes"
            git diff --stat -- src/main/resources/assets/galdurui/textures
            exit 1
          fi

      # src/ must be committed on vcsVersion (settings.gradle.kts), not on another active version.
      - name: Check the committed Stonecutter version
        run: |
          active=$(grep -oP 'stonecutter active "\K[^"]+' stonecutter.gradle.kts)
          vcs=$(grep -oP 'vcsVersion = "\K[^"]+' settings.gradle.kts)
          if [ "$active" != "$vcs" ]; then
            echo "src/ is on $active, switch back to $vcs before committing (task \"Reset active project\")."
            exit 1
          fi

      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: galdur-ui-jars
          path: versions/*/build/libs/*.jar
          if-no-files-found: error
