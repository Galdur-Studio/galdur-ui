name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew build javadoc --no-daemon

      # The test mod (src/testmod) and the dev tools must never end up in the library jar.
      - name: Check the jar holds no test mod
        run: |
          if for jar in build/libs/*.jar; do unzip -l "$jar"; done | grep -E "testmod|galduruitest|resourcepacks/"; then
            echo "Test mod files found in the jar."
            exit 1
          fi

      # The committed PNGs must be exactly what tools/GenerateSprites.java produces.
      # git status (not git diff) also sees new, untracked files.
      - name: Check sprites are up to date
        run: |
          ./gradlew generateSprites --no-daemon
          changes=$(git status --porcelain -- src/main/resources/assets/galdurui/textures)
          if [ -n "$changes" ]; then
            echo "Sprites out of date (run ./gradlew generateSprites and commit):"
            echo "$changes"
            git diff --stat -- src/main/resources/assets/galdurui/textures
            exit 1
          fi

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: galdur-ui-jar
          path: build/libs/*.jar
          if-no-files-found: error
