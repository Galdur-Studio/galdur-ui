name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Builds common (vanilla only), NeoForge, Fabric and Forge: one jar per loader.
      - name: Build with Gradle
        run: ./gradlew build javadoc --no-daemon

      # The test mod (neoforge/src/testmod) and the dev tools must never end up in a library jar.
      - name: Check the jars hold no test mod
        run: |
          if for jar in neoforge/build/libs/*.jar fabric/build/libs/*.jar forge/build/libs/*.jar; do unzip -l "$jar"; done | grep -E "testmod|galduruitest|resourcepacks/"; then
            echo "Test mod files found in a jar."
            exit 1
          fi

      # The committed PNGs must be exactly what common/tools/GenerateSprites.java produces.
      # git status (not git diff) also sees new, untracked files.
      - name: Check sprites are up to date
        run: |
          ./gradlew :common:generateSprites --no-daemon
          changes=$(git status --porcelain -- common/src/main/resources/assets/galdurui/textures)
          if [ -n "$changes" ]; then
            echo "Sprites out of date (run ./gradlew :common:generateSprites and commit):"
            echo "$changes"
            git diff --stat -- common/src/main/resources/assets/galdurui/textures
            exit 1
          fi

      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: galdur-ui-jars
          path: |
            neoforge/build/libs/*.jar
            fabric/build/libs/*.jar
            forge/build/libs/*.jar
          if-no-files-found: error
