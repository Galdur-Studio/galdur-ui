# No configuration cache: Loom (Fabric) and ForgeGradle do not support it.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# Parchment: real parameter names and Javadoc in Minecraft code. https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# NeoForm: vanilla Minecraft without any loader, to compile the shared code (common).
# Must match minecraft_version. https://projects.neoforged.net/neoforged/neoform
neoform_version=1.21.1-20240808.144430

# NeoForge versions: https://projects.neoforged.net/neoforged/neoforge (must match minecraft_version)
neo_version=21.1.256
loader_version_range=[1,)

# Optional integrations (compileOnly, launched in dev only).
# JEI: https://maven.blamejared.com/mezz/jei/ ; EMI: https://modrinth.com/mod/emi/versions
jei_version=19.64.0.454
emi_version=1.1.24+1.21.1

## Mod information

# Must match GaldurUI.MODID.
mod_id=galdurui
mod_name=Galdur UI
# SPDX identifier. Full texts: LICENSE (LGPL v3) and COPYING (GPL v3).
mod_license=LGPL-3.0-only
mod_authors=Galdur Studio
mod_description=Galdur Studio's GUI library: theme, components and screens for Minecraft mods.
# https://semver.org/
mod_version=0.1.0
mod_group_id=com.galdurstudio.galdurui

## Fabric (https://fabricmc.net/develop)
fabric_loader_version=0.20.1
fabric_api_version=0.116.17+1.21.1
# Mod Menu: https://modrinth.com/mod/modmenu/versions
modmenu_version=11.0.4
# JEI on Fabric: last version built with a Loom that Gradle 9.3 can read.
jei_fabric_version=19.50.0.414
