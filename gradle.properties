# Gradle options only. Versions of the mod, of Minecraft and of the dependencies are in
# stonecutter.properties.toml.

# No configuration cache: Loom (Fabric) and ForgeGradle do not support it.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# ForgeGradle 7 merges the source sets (client and server) like the other toolchains do.
net.minecraftforge.gradle.merge-source-sets=true
