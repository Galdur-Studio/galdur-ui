# Taille maximale du tas de la JVM Gradle (modifiable en ligne de commande).
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment : vrais noms d'arguments et Javadoc dans le code de Minecraft.
# Versions disponibles : https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
# Versions de NeoForge : https://projects.neoforged.net/neoforged/neoforge
# minecraft_version et neo_version doivent correspondre.
minecraft_version=1.21.1
# Versions de Minecraft compatibles, reprises dans neoforge.mods.toml.
minecraft_version_range=[1.21.1]
neo_version=21.1.256
# Bornes en version majeure de FML uniquement.
loader_version_range=[1,)

## Informations du mod

# Identifiant du mod, de la forme [a-z][a-z0-9_]{1,63} ; doit valoir GaldurUI.MODID.
mod_id=galdurui
# Nom lisible, dans la liste des mods.
mod_name=Galdur UI
# Licence (identifiant SPDX). Textes complets : LICENSE (LGPL v3) et COPYING (GPL v3).
mod_license=LGPL-3.0-only
# Auteurs, dans la liste des mods.
mod_authors=Galdur Studio
# Description, dans la liste des mods. Ce fichier est lu en ISO-8859-1 : coder les accents en \uXXXX.
mod_description=Biblioth\u00e8que d'interface de Galdur Studio : th\u00e8me, composants et \u00e9crans pour nos mods.
# Version du mod (https://semver.org/).
mod_version=0.1.0
# Groupe Maven, utile seulement pour la publication ; reprend le package de base du mod.
mod_group_id=com.galdurstudio.galdurui
